name: Generate issues from SRS

on:
  workflow_dispatch:
    inputs:
      srs_path:
        description: Path to the SRS markdown file
        default: .github/srs/SRS.md
      dry_run:
        description: Only print the issues, do not create them
        type: boolean
        default: true
      model:
        description: GitHub Models model ID
        default: openai/gpt-4.1

permissions:
  contents: read
  issues: write
  models: read   # lets GITHUB_TOKEN call GitHub Models

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create issues from SRS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRS_PATH: ${{ inputs.srs_path }}
          DRY_RUN: ${{ inputs.dry_run }}
          MODEL: ${{ inputs.model }}
        run: python .github/scripts/srs_to_issues.py